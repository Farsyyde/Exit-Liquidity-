function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*r())}
const K=0.03;
function makeMarket(L,rng){return{t:0,lf:0,dev:0,p0:0.01+rng()*0.4,p:0,q:[],nextEv:Infinity,L:L,rng:rng}}
function pickEvent(L,r){
  const w=[['pump',3.4],['dump',2.2],['dip',3],['spike',2]];
  if(L.rug)w.push(['rug',0.6]);
  let tot=0;for(const x of w)tot+=x[1];
  let z=r()*tot,type='pump';
  for(const x of w){z-=x[1];if(z<=0){type=x[0];break}}
  const v=Math.sqrt(L.vol);
  if(type==='pump'||type==='dump')return{type:type,mag:(0.16+r()*0.14)*v,dur:25+Math.floor(r()*20)};
  if(type==='dip'||type==='spike')return{type:type,mag:(0.15+r()*0.10)*v,dur:3};
  return{type:type,mag:0.55+r()*0.25,dur:8};
}
// One 100ms step. Returns a headline object when one fires, else null.
function stepMarket(m,posDir,lead){
  const L=m.L,r=m.rng;m.t++;
  let fresh=null;
  if(m.t>=m.nextEv){
    const ev=pickEvent(L,r),fake=r()<L.fake;
    fresh={t:m.t,type:ev.type,fake:fake,n:Math.floor(r()*8)};
    if(!fake){ev.start=m.t+lead;ev.end=ev.start+ev.dur;m.q.push(ev)}
    m.nextEv=m.t+L.gapMin+r()*L.gapVar;
  }
  let drift=0,shock=0;
  for(const e of m.q){
    if(m.t>e.start&&m.t<=e.end){
      const s=e.mag/e.dur;
      if(e.type==='pump')drift+=s;else if(e.type==='dump'||e.type==='rug')drift-=s;
      else if(e.type==='dip')shock-=s;else shock+=s;
    }
  }
  m.q=m.q.filter(function(e){return m.t<=e.end});
  if(L.hunter&&posDir)shock-=0.002*posDir;
  m.lf+=drift+0.0025*L.vol*gauss(r);
  m.dev=m.dev*(1-K)+0.008*L.vol*gauss(r)+shock;
  m.p=m.p0*Math.exp(m.lf+m.dev);
  return fresh;
}

const $=function(id){return document.getElementById(id)};
let S=null,M=null,Lv=null,mode='attract',dispEq=100,offers=[],sel=null,shopNote='';

function fm(n){const a=Math.abs(n);if(a>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(a>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(a>=1e4)return'$'+(n/1e3).toFixed(1)+'K';if(a>=100)return'$'+Math.round(n).toLocaleString('en-US');return'$'+n.toFixed(2)}
function fp(p){if(p>=1)return p.toFixed(3);if(p<1e-6)return p.toExponential(2);return p.toPrecision(3)}
function has(id){return S.inds.indexOf(id)>=0||S.nft===id}
function consCount(){return S.cons.filter(Boolean).length}
function slots(){return SLOTS+(has('sticky')?2:0)}
function descOf(id){
  const x=IND[id];let d=x.d;
  if(id==='bag')d+=' Now +'+S.bagMult.toFixed(1)+'.';
  if(id==='whale')d+=' Now +'+S.whaleMult.toFixed(2)+'.';
  return d;
}
function lg(code){S.log.push([S.i,mode==='play'&&Lv?M.t-Lv.t0:-1,code])}

/* ---------- sound ---------- */
let AC=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function beep(f,d,type,v,when){
  if(muted||!AC)return;
  try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}
}
function winSound(streak){const base=440*Math.pow(1.06,Math.min(streak,14));beep(base,.09,'square',.05,0);beep(base*1.26,.09,'square',.05,.07);beep(base*1.5,.14,'square',.05,.14)}

/* ---------- storage (one viewer's keepsake, may be missing) ---------- */
function readMint(){try{const v=JSON.parse(localStorage.getItem(MINT_KEY)||'null');return v&&IND[v.id]&&v.runs>0?v:null}catch(e){return null}}
function writeMint(v){try{localStorage.setItem(MINT_KEY,JSON.stringify(v))}catch(e){}}

/* ---------- run and level setup ---------- */
function blankRun(){
  const seed=(Math.random()*4294967296)>>>0;
  return{i:0,bank:100,credits:0,inds:[],cons:[null,null],nft:null,streak:0,seed:seed,rng:mulberry32(seed),shopRng:mulberry32((seed^0x9E3779B9)>>>0),
         trades:0,best:0,bagMult:0,whaleMult:0,martin:false,log:[]};
}
function prepLevel(){
  const L=LEVELS[S.i],live=mode!=='attract';
  const before=S.bank;
  let drop=0,loan=0,gain=L.gain,drained=null;
  if(live&&has('sticky')){
    const c=S.inds.filter(function(id){return id!=='sticky'});
    if(c.length&&S.shopRng()<0.10){drained=c[Math.floor(S.shopRng()*c.length)];S.inds.splice(S.inds.indexOf(drained),1)}
  }
  if(live&&has('airdrop')){drop=S.bank*0.08;S.bank+=drop}
  if(live&&has('devwallet')){loan=S.bank;gain*=1.5}
  M=makeMarket(L,S.rng);
  Lv={L:L,start:S.bank,target:before*(1+gain),cash:S.bank+loan,debt:loan,pos:null,dur:450+(live&&has('time')?120:0),
      candles:[],cur:null,lastP:null,high:0,copium:has('copium'),feed:[],drop:drop,loan:loan,drained:drained,
      vlo:null,vhi:null,done:false,taxN:0,pumpT:-999,lastSnap:null};
  for(let k=0;k<52*CANDLE;k++){stepMarket(M,0,12);pushTick()}
  M.nextEv=M.t+12;Lv.t0=M.t;Lv.high=M.p;
  dispEq=Lv.start;
  renderNews();renderInds();renderCons();
}
function pushTick(){
  const p=M.p;
  if(!Lv.cur){const o=Lv.lastP==null?p:Lv.lastP;Lv.cur={o:o,h:Math.max(o,p),l:Math.min(o,p),c:p,f:0,n:0}}
  const c=Lv.cur;c.h=Math.max(c.h,p);c.l=Math.min(c.l,p);c.c=p;c.f=M.p0*Math.exp(M.lf);c.n++;Lv.lastP=p;
  if(c.n>=CANDLE){Lv.candles.push(c);Lv.cur=null;if(Lv.candles.length>90)Lv.candles.shift()}
}
function ma20(){
  const a=Lv.candles.slice(-20);let s=0,n=0;
  for(const c of a){s+=c.c;n++}
  if(Lv.cur){s+=Lv.cur.c;n++}
  return n?s/n:M.p;
}
function addFeed(text,fake,mine){
  Lv.feed.unshift({text:text.replace('{T}',Lv.L.tk),fake:fake,mine:mine});
  if(Lv.feed.length>2)Lv.feed.pop();
  renderNews();
}

/* ---------- trading ---------- */
function feeRate(){return has('mev')?0:0.005}
function levNow(){return(has('lev2')?2:1)*(has('lev5')?5:1)}
function posValue(){const x=Lv.pos;return Math.max(0,x.margin*(1+x.lev*x.dir*(M.p/x.entry-1)))}
function equity(){return Lv.cash+(Lv.pos?posValue():0)-Lv.debt}
function apeLocked(){return!!Lv.pos&&has('ape')&&M.t-Lv.pos.t0<20}
function openPos(dir){
  if(mode!=='play'||Lv.pos||Lv.cash<=0)return;
  if(dir===-1&&!has('short'))return;
  const fee=Lv.cash*feeRate();
  Lv.pos={dir:dir,basis:Lv.cash,margin:Lv.cash-fee,entry:M.p,lev:levNow(),t0:M.t,worst:0,
          snap:{cash:Lv.cash,debt:Lv.debt,streak:S.streak,martin:S.martin},
          snipe:dir===1&&has('sniper')&&M.p<=ma20()*0.94,
          whale:dir===1&&M.t-Lv.pumpT<=20};
  Lv.cash=0;lg(dir===1?'O+':'O-');
  beep(dir===1?520:300,.07,'square',.05);
  if(Lv.pos.snipe)pop('SNIPED','dip entry, +0.75 mult','var(--blue)');
}
function closePos(why){
  const x=Lv.pos;if(!x)return;
  const net=posValue()*(1-feeRate());
  const profit=net-x.basis;
  let add=0,mult=1;const tags=[];
  if(profit>0){
    mult=1+S.streak*(has('compound')?0.2:0.1);
    const held=(M.t-x.t0)/10;
    if(has('diamond')){const b=Math.min(1,held*0.05);if(b>=0.05){mult+=b;tags.push('diamond')}}
    if(has('paper')&&held<=3){mult+=0.5;tags.push('paper')}
    if(x.snipe){mult+=0.75;tags.push('sniped')}
    if(has('top')&&x.dir===1&&M.p>=Lv.high*0.97){mult+=1;tags.push('top tick')}
    if(has('bag')){if(x.worst<=-0.15){S.bagMult+=0.1;tags.push('bag grew')}mult+=S.bagMult}
    if(has('whale')){if(x.whale){S.whaleMult+=0.15;tags.push('whale grew')}mult+=S.whaleMult}
    if(has('ape')){mult+=2;tags.push('ape')}
    if(S.martin){if(has('martin')){mult*=2;tags.push('martingale')}S.martin=false}
    add=profit*(mult-1);
    if(profit>=x.basis*0.02)S.streak++;
    const total=profit+add;
    if(total>S.best)S.best=total;
    pop('+'+fm(total).slice(1),(mult>1.001?'x'+mult.toFixed(2)+' ':'')+tags.join(' + '),'var(--up)');
    winSound(S.streak);
    if(total>x.basis*0.15)shake();
  }else{
    const notes=[];if(why)notes.push(why);
    if(Lv.copium&&S.streak>0){Lv.copium=false;notes.push('copium saved streak')}
    else S.streak=0;
    S.martin=has('martin');
    if(has('tax')&&Lv.taxN<2){Lv.taxN++;S.credits++;notes.push('+1 alpha harvested')}
    pop('-'+fm(-profit).slice(1),notes.join(', '),'var(--down)');
    beep(150,.18,'sawtooth',.05);
  }
  Lv.cash+=net+add;Lv.pos=null;Lv.lastSnap=x.snap;S.trades++;
}
function manualClose(){if(apeLocked()){beep(110,.08,'square',.04);return}lg('X');closePos()}
function pressBuy(){if(mode!=='play')return;if(Lv.pos){if(Lv.pos.dir===-1)manualClose()}else openPos(1)}
function pressSell(){if(mode!=='play')return;if(Lv.pos){if(Lv.pos.dir===1)manualClose()}else openPos(-1)}
function pressLock(){if(mode!=='play'||Lv.pos||Lv.cash-Lv.debt<Lv.target)return;lg('L');endLevel(true)}

/* ---------- items ---------- */
function useCons(k){
  const id=S.cons[k];if(!id)return;const c=CON[id];
  if(mode!=='play'){$('info').textContent=c.name+': '+c.d;return}
  const v=Math.sqrt(Lv.L.vol);
  if(id==='inject'){
    const X=Lv.start*0.5;Lv.debt+=X;
    if(Lv.pos){
      const x=Lv.pos,V=posValue(),net=X*(1-feeRate()),m2=x.margin+net;
      const k2=((V+net)/m2-1)/(x.lev*x.dir);
      x.entry=M.p/(1+k2);x.margin=m2;x.basis+=X;
      pop('+'+fm(X).slice(1)+' INJECTED','added to your trade','var(--blue)');
    }else{Lv.cash+=X;pop('+'+fm(X).slice(1)+' INJECTED','added to cash','var(--blue)')}
  }else if(id==='shill'){
    M.q.push({type:'pump',mag:0.22*v,dur:30,start:M.t+5,end:M.t+35});Lv.pumpT=M.t;
    addFeed('You paid a guy. He is posting about {T} right now',false,true);
  }else if(id==='fud'){
    M.q.push({type:'dip',mag:0.2*v,dur:3,start:M.t+5,end:M.t+8});
    addFeed('Your burner account says {T} is finished',false,true);
  }else if(id==='breaker'){
    M.q=[];addFeed('Trading halt on {T}. Every pending move is cancelled',false,true);
  }else if(id==='reorg'){
    if(Lv.pos||!Lv.lastSnap){pop('NOTHING TO UNDO','close a trade first','var(--dim)');return}
    const s=Lv.lastSnap;Lv.cash=s.cash;Lv.debt=s.debt;S.streak=s.streak;S.martin=s.martin;Lv.lastSnap=null;
    pop('REORG','last trade erased','var(--blue)');
  }
  lg('C:'+id);S.cons[k]=null;renderCons();
  beep(990,.06,'triangle',.05);beep(1320,.1,'triangle',.05,.06);
}

/* ---------- main loop ---------- */
function tick(){
  if(mode!=='play'&&mode!=='attract')return;
  const lead=mode==='play'&&has('insider')?24:12;
  const fresh=stepMarket(M,Lv.pos?Lv.pos.dir:0,lead);
  pushTick();
  if(M.p>Lv.high)Lv.high=M.p;
  if(fresh){
    const arr=HEAD[fresh.type];
    if(fresh.type==='pump')Lv.pumpT=M.t;
    addFeed(arr[fresh.n%arr.length],fresh.fake,false);
    if(mode==='play')beep(fresh.type==='rug'?180:880,.05,'triangle',.04);
  }
  if(mode!=='play')return;
  if(Lv.pos){
    const x=Lv.pos;
    if(has('funding'))x.margin*=x.dir===-1?1.0004:0.9998;
    const v=posValue(),r=v/x.margin-1;
    if(r<x.worst)x.worst=r;
    if(v<=0){Lv.pos=null;S.streak=0;S.martin=has('martin');S.trades++;pop('LIQUIDATED','position wiped','var(--down)');beep(90,.4,'sawtooth',.07);shake()}
    else if(has('stop')&&r<=-0.12)closePos('stop loss');
  }
  const left=Lv.dur-(M.t-Lv.t0);
  if(left<=50&&left>0&&left%10===0)beep(660,.04,'square',.03);
  if(equity()<=0||(!Lv.pos&&equity()<0.5)){endLevel(false);return}
  if(left<=0)endLevel(false);
}
function endLevel(locked){
  if(Lv.done)return;Lv.done=true;
  if(Lv.pos)closePos('time up');
  const left=Math.max(0,Lv.dur-(M.t-Lv.t0));
  const bank=Math.max(0,Lv.cash-Lv.debt);
  mode='pause';
  if(bank>=Lv.target){
    const sPct=(bank/Lv.target-1)*100;
    const a=3,b=Math.min(6,Math.floor(sPct/15)),c=locked?Math.floor(left/100):0;
    S.bank=bank;S.credits+=a+b+c;
    shopNote='Cleared with '+fm(bank)+' against a '+fm(Lv.target)+' target. Alpha earned: '+a+' base'+(b?', +'+b+' surplus':'')+(c?', +'+c+' speed':'')+'.';
    beep(523,.1,'square',.05,0);beep(659,.1,'square',.05,.1);beep(784,.2,'square',.05,.2);
    if(S.i>=LEVELS.length-1){showEnd(true)}else{S.i++;rollOffers();showShop()}
  }else{
    S.bank=bank;
    beep(196,.25,'sawtooth',.06,0);beep(130,.5,'sawtooth',.06,.2);
    showEnd(false);
  }
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(400,now-last);last=now;
  while(acc>=TICK){acc-=TICK;tick()}
  draw();
  requestAnimationFrame(frame);
}

/* ---------- drawing ---------- */
const cv=$('chart'),ctx=cv.getContext('2d');
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
let COL=null;
function draw(){
  if(!Lv)return;
  if(!COL)COL={up:css('--up'),down:css('--down'),gold:css('--gold'),blue:css('--blue'),dim:css('--dim'),edge:css('--panel-edge'),cream:css('--cream')};
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const N=46,cs=Lv.candles.slice(-(N-1));if(Lv.cur)cs.push(Lv.cur);
  if(!cs.length)return;
  const showFair=mode==='play'&&has('vwap');
  let lo=Infinity,hi=-Infinity;
  for(const c of cs){if(c.l<lo)lo=c.l;if(c.h>hi)hi=c.h;if(showFair){if(c.f<lo)lo=c.f;if(c.f>hi)hi=c.f}}
  if(Lv.pos){lo=Math.min(lo,Lv.pos.entry);hi=Math.max(hi,Lv.pos.entry)}
  const padv=(hi-lo)*0.1||hi*0.02;lo-=padv;hi+=padv;
  if(Lv.vlo==null){Lv.vlo=lo;Lv.vhi=hi}else{Lv.vlo+=(lo-Lv.vlo)*0.18;Lv.vhi+=(hi-Lv.vhi)*0.18}
  lo=Math.min(Lv.vlo,lo+padv*0.5);hi=Math.max(Lv.vhi,hi-padv*0.5);
  const gut=58,top=8,bot=8,pw=w-gut,cw=pw/N;
  const y=function(v){return top+(hi-v)/(hi-lo)*(h-top-bot)};
  ctx.font='14px VT323, monospace';ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(138,148,173,.14)';ctx.lineWidth=1;ctx.fillStyle=COL.dim;
  for(let g=1;g<=3;g++){
    const v=lo+(hi-lo)*g/4,yy=Math.round(y(v))+.5;
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(pw,yy);ctx.stroke();
    ctx.fillText(fp(v),pw+5,yy);
  }
  const x0=pw-cs.length*cw;
  for(let k=0;k<cs.length;k++){
    const c=cs[k],x=x0+k*cw,up=c.c>=c.o;
    ctx.fillStyle=up?COL.up:COL.down;
    const mid=Math.round(x+cw/2);
    ctx.fillRect(mid,y(c.h),1,Math.max(1,y(c.l)-y(c.h)));
    const yt=y(Math.max(c.o,c.c)),yb=y(Math.min(c.o,c.c));
    ctx.fillRect(Math.round(x+1),yt,Math.max(2,Math.round(cw-2)),Math.max(1.5,yb-yt));
  }
  if(showFair){
    ctx.strokeStyle=COL.blue;ctx.lineWidth=2;ctx.beginPath();
    for(let k=0;k<cs.length;k++){const xx=x0+k*cw+cw/2,yy=y(cs[k].f);if(k)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy)}
    ctx.stroke();
  }
  if(mode==='play'&&has('sniper')&&!Lv.pos){
    const v=ma20()*0.94;
    if(v>lo&&v<hi){hline(y(v),COL.blue,[2,4],pw);ctx.fillStyle=COL.blue;ctx.fillText('SNIPE',4,y(v)-8)}
  }
  if(Lv.pos){
    const ye=y(Lv.pos.entry);hline(ye,COL.gold,[5,4],pw);
    ctx.fillStyle=COL.gold;ctx.fillText('ENTRY',4,ye-8);
  }
  const p=M.p,yp=Math.max(top+8,Math.min(h-bot-8,y(p))),upNow=cs[cs.length-1].c>=cs[cs.length-1].o;
  hline(yp,upNow?COL.up:COL.down,[1,3],pw);
  ctx.fillStyle=upNow?COL.up:COL.down;ctx.fillRect(pw+1,yp-9,gut-3,18);
  ctx.fillStyle='#0c1018';ctx.fillText(fp(p),pw+5,yp+1);
  drawHud();
}
function hline(yy,col,dash,pw){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(0,Math.round(yy)+.5);ctx.lineTo(pw,Math.round(yy)+.5);ctx.stroke();ctx.restore()}

const el={eq:$('eq'),tg:$('tg'),mult:$('mult'),px:$('px'),tk:$('tk'),layer:$('layer'),tf:$('timerFill'),tt:$('timerTxt'),timer:$('timer'),
          buy:$('buyBtn'),sell:$('sellBtn'),lock:$('lockBtn'),pos:$('posTag')};
let hudKey='';
function drawHud(){
  const eqv=mode==='attract'?Lv.start:Math.max(0,equity());
  dispEq+=(eqv-dispEq)*0.3;if(Math.abs(eqv-dispEq)<0.005)dispEq=eqv;
  el.eq.textContent=fm(dispEq);
  el.eq.className=eqv>=Lv.target?'win':(eqv<Lv.start*0.999?'lose':'');
  el.tg.textContent=fm(Lv.target);
  const m=1+S.streak*(has('compound')?0.2:0.1);
  el.mult.textContent='x'+m.toFixed(1);el.mult.className=S.streak>=5?'hot':'';
  el.px.textContent=fp(M.p);el.tk.textContent=Lv.L.tk;
  el.layer.textContent='LAYER '+(LEVELS.length-S.i);
  const left=mode==='attract'?Lv.dur:Math.max(0,Lv.dur-(M.t-Lv.t0));
  el.tf.style.transform='scaleX('+(left/Lv.dur)+')';
  el.tt.textContent=Math.ceil(left/10)+'s';
  el.timer.className='timer'+(left<=80?' low':'');
  const x=Lv.pos,canShort=has('short'),playing=mode==='play',ape=playing&&apeLocked();
  const pct=Math.max(0,Math.min(1,(eqv-Lv.start)/(Lv.target-Lv.start)));
  const ready=playing&&!x&&Lv.cash-Lv.debt>=Lv.target;
  const key=[playing,x?x.dir:0,canShort,ready,Math.floor(pct*100),eqv>=Lv.target,ape].join('|');
  if(key!==hudKey){
    hudKey=key;
    const lockTxt='LOCKED<small>APE MODE</small>';
    el.buy.innerHTML=x&&x.dir===-1?(ape?lockTxt:'COVER<small>CLOSE SHORT</small>'):'BUY<small>ALL IN</small>';
    el.sell.innerHTML=x?(x.dir===1&&ape?lockTxt:'SELL<small>ALL OUT</small>'):(canShort?'SHORT<small>ALL IN</small>':'SELL<small>ALL OUT</small>');
    el.buy.disabled=!playing||(!!x&&(x.dir===1||ape));
    el.sell.disabled=!playing||(x?(x.dir===-1||ape):!canShort);
    el.lock.disabled=!ready;
    el.lock.className='btn lock'+(ready?' ready':'');
    el.lock.innerHTML=ready?'LOCK IN<small>END LEVEL</small>':(eqv>=Lv.target?'CLOSE<small>TO LOCK IN</small>':Math.floor(pct*100)+'%<small>OF TARGET</small>');
  }
  if(x){
    const r=(posValue()/x.margin-1)*100;
    el.pos.style.display='block';
    el.pos.style.color=r>=0?COL.up:COL.down;
    el.pos.textContent=(x.dir===1?'LONG':'SHORT')+(x.lev>1?' '+x.lev+'x':'')+' '+(r>=0?'+':'')+r.toFixed(1)+'%';
  }else el.pos.style.display='none';
}
function pop(big,small,col){
  const d=document.createElement('div');d.className='pop';d.style.color=col;
  d.textContent=big;if(small){const s=document.createElement('small');s.textContent=small;d.appendChild(s)}
  $('pops').appendChild(d);setTimeout(function(){d.remove()},1300);
}
function shake(){const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
function renderNews(){
  const n=$('news');n.textContent='';
  if(!Lv.feed.length){const d=document.createElement('div');d.className='h old';d.textContent='The wire is quiet. Headlines land here before the chart moves.';n.appendChild(d);return}
  const flag=mode==='play'&&has('insider');
  Lv.feed.forEach(function(f,k){
    const fk=flag&&f.fake;
    const d=document.createElement('div');d.className='h '+(k===0?'new':'old')+(fk?' fake':'');
    const t=document.createElement('span');t.className='tag'+(fk?' fk':(f.mine?' me':''));t.textContent=fk?'FAKE':(f.mine?'YOU':'WIRE');
    d.appendChild(t);d.appendChild(document.createTextNode(f.text));n.appendChild(d);
  });
}
function cardHTML(id,extra,act){
  const x=IND[id];
  return'<button type="button" class="card'+(x.c?' cursed':'')+(extra?' '+extra:'')+'" data-id="'+id+'"'+(act?' data-act="'+act+'"':'')+' aria-label="'+x.name+'"><span class="g">'+x.g+'</span><span class="n">'+x.name+'</span></button>';
}
function renderInds(){
  let h='';
  if(S.nft)h+=cardHTML(S.nft,'nft');
  const n=Math.max(slots(),S.inds.length);
  for(let k=0;k<n;k++)h+=S.inds[k]?cardHTML(S.inds[k]):'<span class="card empty"></span>';
  $('inds').innerHTML=h;
}
function renderCons(){
  const box=$('cons');box.textContent='';
  for(let k=0;k<CSLOTS;k++){
    const id=S.cons[k],b=document.createElement('button');b.type='button';
    if(id){b.className='citem';b.dataset.k=k;b.textContent=CON[id].g+' '+CON[id].name}
    else{b.className='citem empty';b.disabled=true;b.textContent='ITEM SLOT'}
    box.appendChild(b);
  }
}
$('inds').addEventListener('click',function(e){
  const c=e.target.closest('.card');if(!c||!c.dataset.id)return;
  $('info').textContent=IND[c.dataset.id].name+': '+descOf(c.dataset.id);
});
$('cons').addEventListener('pointerdown',function(e){
  const b=e.target.closest('.citem');if(!b||b.dataset.k==null)return;
  e.preventDefault();initAudio();useCons(+b.dataset.k);
});

/* ---------- screens ---------- */
const ov=$('overlay'),md=$('modal');
function show(html){md.innerHTML=html;ov.classList.remove('hide');md.scrollTop=0}
function hide(){ov.classList.add('hide')}
function showTitle(){
  const mint=readMint();
  show('<span class="eyebrow">WORKING TITLE, PLAYABLE MVP</span><h1>EXIT LIQUIDITY</h1>'+
  '<p>You fell asleep at the terminal and woke up inside it. Eight layers of memecoins sit between you and reality. Trade your way out.</p>'+
  '<ul><li>Buy the dips, sell the highs, hit the target before the clock runs out.</li>'+
  '<li>Read the wire. Headlines land about a second before the chart moves, and some are lies.</li>'+
  '<li>Winning trades in a row build your streak multiplier. One loss resets it.</li>'+
  '<li>Between layers, spend alpha on indicators that bend the rules and one-shot items you fire mid-trade.</li></ul>'+
  (mint?'<p><span class="chip y">MINTED</span>'+IND[mint.id].name+' joins this run ('+mint.runs+' left).</p>':'')+
  '<div class="row"><button class="btn go" data-act="start" type="button">START RUN</button></div>'+
  '<p class="eyebrow">KEYS: B BUY, S SELL, L LOCK IN, 1 AND 2 ITEMS</p>');
}
function showIntro(){
  mode='pause';prepLevel();
  const L=Lv.L;let chips='';
  if(L.rug)chips+='<span class="chip">RUGS ENABLED</span>';
  if(L.fake>=.3)chips+='<span class="chip y">FAKE NEWS '+Math.round(L.fake*100)+'%</span>';
  if(L.hunter)chips+='<span class="chip b">BOSS: THE MARKET MAKER</span>';
  show('<span class="eyebrow">LAYER '+(LEVELS.length-S.i)+' OF '+LEVELS.length+'</span><h1>'+L.tk+'</h1>'+
  '<p class="lore">'+L.lore+'</p>'+(chips?'<p>'+chips+'</p>':'')+
  (L.hunter?'<p>While you hold a position, the price leans against it. Get in, get paid, get out.</p>':'')+
  (Lv.drained?'<p><span class="chip c">DRAINED</span>Someone read your sticky note. '+IND[Lv.drained].name+' is gone.</p>':'')+
  (Lv.drop?'<p><span class="chip g">AIRDROP</span>+'+fm(Lv.drop)+' landed in your wallet.</p>':'')+
  (Lv.loan?'<p><span class="chip c">DEV WALLET</span>'+fm(Lv.loan)+' on loan to trade with. Repaid at the bell.</p>':'')+
  '<p>Turn <b>'+fm(Lv.start)+'</b> into <b style="color:var(--gold)">'+fm(Lv.target)+'</b> in '+(Lv.dur/10)+' seconds.</p>'+
  '<div class="row"><button class="btn go" data-act="trade" type="button">OPEN THE CHART</button></div>');
}
function shuffled(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(S.shopRng()*(k+1));const t=a[k];a[k]=a[j];a[j]=t}return a}
function rollOffers(){
  const a=shuffled(INDS.filter(function(x){return!has(x.id)})).slice(0,3).map(function(x){return{id:x.id,sold:false,con:false}});
  const b=shuffled(CONS).slice(0,2).map(function(x){return{id:x.id,sold:false,con:true}});
  offers=a.concat(b);sel=null;
}
function showShop(){
  let h='<span class="eyebrow">BETWEEN LAYERS</span><h1>THE DESK</h1><p>'+shopNote+'</p>'+
  '<p class="alpha">ALPHA TO SPEND: '+S.credits+'</p>';
  offers.forEach(function(o,k){
    const x=o.con?CON[o.id]:IND[o.id];
    const full=o.con?consCount()>=CSLOTS:S.inds.length>=slots();
    const no=o.sold||S.credits<x.cost||full;
    if(k===3)h+='<h2>ITEMS, ONE USE EACH ('+consCount()+'/'+CSLOTS+')</h2>';
    h+='<div class="offer'+(o.sold?' sold':'')+'"><div class="card'+(o.con?' con':'')+(x.c?' cursed':'')+'"><span class="g">'+x.g+'</span></div>'+
       '<div><div class="t">'+x.name+(x.c?' <span class="chip c">CURSED</span>':'')+'</div><div class="d">'+x.d+'</div></div>'+
       '<button class="btn" data-act="buy" data-k="'+k+'" type="button"'+(no?' disabled':'')+'>'+(o.sold?'SOLD':x.cost)+'</button></div>';
  });
  h+='<h2>YOUR INDICATORS ('+S.inds.length+'/'+slots()+')</h2><div class="inds">';
  if(S.nft)h+=cardHTML(S.nft,'nft','pick');
  const n=Math.max(slots(),S.inds.length);
  for(let k=0;k<n;k++){const id=S.inds[k];h+=id?cardHTML(id,sel===id?'sel':'','pick'):'<span class="card empty"></span>'}
  h+='</div>';
  if(sel&&IND[sel]){
    const mine=S.inds.indexOf(sel)>=0;
    h+='<p>'+IND[sel].name+': '+descOf(sel)+(mine?'':' Minted, cannot be sold.')+'</p>';
    if(mine)h+='<div class="row"><button class="btn alt" data-act="sellind" type="button">SELL FOR 1 ALPHA</button></div>';
  }else h+='<p style="color:var(--dim)">Tap one of yours to read it or sell it.</p>';
  h+='<div class="row"><button class="btn alt" data-act="reroll" type="button"'+(S.credits<1?' disabled':'')+'>REROLL (1)</button>'+
     '<button class="btn go" data-act="next" type="button">NEXT LAYER</button></div>';
  show(h);renderInds();renderCons();
}
function receipt(won){
  return JSON.stringify({game:'exit-liquidity',v:2,seed:S.seed,mint:S.nft,log:S.log,result:{layers:won?LEVELS.length:S.i,bank:+S.bank.toFixed(2)}});
}
function showEnd(won){
  const seed=S.seed.toString(16).toUpperCase().padStart(8,'0');
  let h=won?'<span class="eyebrow">LAYER 0</span><h1>REALITY</h1><p>The terminal goes dark. You are at your desk. It is 4:12 AM. Your real portfolio is down 3%. It is, somehow, a relief.</p>'
           :'<span class="eyebrow">LAYER '+(LEVELS.length-S.i)+', '+Lv.L.tk+'</span><h1>MARGIN CALLED</h1><p>You needed '+fm(Lv.target)+' and closed with '+fm(S.bank)+'. The terminal resets. So do you.</p>';
  h+='<div class="stat"><span>Layers cleared</span><span>'+(won?LEVELS.length:S.i)+' of '+LEVELS.length+'</span>'+
     '<span>Final bankroll</span><span>'+fm(S.bank)+'</span><span>Trades closed</span><span>'+S.trades+'</span>'+
     '<span>Best single trade</span><span>'+fm(S.best)+'</span><span>Run seed</span><span>'+seed+'</span></div>';
  if(S.inds.length){
    h+='<h2>MINT ONE TO KEEP</h2><p>Pick one indicator. It joins your next 3 runs in a bonus slot. Simulated here, an NFT mint in the real game.</p><div class="inds" id="mintRow">';
    S.inds.forEach(function(id){h+=cardHTML(id,'','mint')});
    h+='</div><p id="mintMsg" style="color:var(--dim)">Minting replaces any indicator you minted before.</p>';
  }
  h+='<div class="row"><button class="btn alt" data-act="copy" data-won="'+(won?1:0)+'" type="button">COPY RUN RECEIPT</button>'+
     '<button class="btn go" data-act="start" type="button">NEW RUN</button></div>'+
     '<p id="rcptMsg" class="eyebrow">THE RECEIPT IS THE SEED PLUS EVERY INPUT. IT IS WHAT A VERIFIER WOULD REPLAY.</p>'+
     '<textarea id="rcpt" readonly aria-label="Run receipt"></textarea>';
  show(h);
}
md.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act;initAudio();beep(700,.04,'square',.03);
  if(act==='start'){
    S=blankRun();
    const m=readMint();
    if(m){S.nft=m.id;m.runs--;writeMint(m)}
    $('info').textContent='Tap an indicator to read what it does.';
    showIntro();
  }else if(act==='trade'){hide();hudKey='';mode='play';renderNews()}
  else if(act==='buy'){
    const o=offers[+b.dataset.k],x=o.con?CON[o.id]:IND[o.id];
    const room=o.con?consCount()<CSLOTS:S.inds.length<slots();
    if(!o.sold&&S.credits>=x.cost&&room){S.credits-=x.cost;if(o.con)S.cons[S.cons.indexOf(null)]=o.id;else S.inds.push(o.id);o.sold=true;lg('buy:'+o.id);showShop()}
  }else if(act==='pick'){sel=sel===b.dataset.id?null:b.dataset.id;showShop()}
  else if(act==='sellind'){const k=S.inds.indexOf(sel);if(k>=0){S.inds.splice(k,1);S.credits+=1;lg('sell:'+sel);sel=null;showShop()}}
  else if(act==='reroll'){if(S.credits>=1){S.credits--;lg('reroll');rollOffers();showShop()}}
  else if(act==='next'){showIntro()}
  else if(act==='mint'){
    writeMint({id:b.dataset.id,runs:3});
    md.querySelectorAll('#mintRow .card').forEach(function(c){c.classList.toggle('nft',c===b)});
    $('mintMsg').textContent=IND[b.dataset.id].name+' minted. It will be waiting in your next 3 runs.';
  }else if(act==='copy'){
    const txt=receipt(b.dataset.won==='1'),msg=$('rcptMsg'),box=$('rcpt');
    const fail=function(){box.value=txt;box.style.display='block';box.focus();box.select();msg.textContent='COPY IS BLOCKED HERE. SELECT THE TEXT BELOW.'};
    try{navigator.clipboard.writeText(txt).then(function(){msg.textContent='RECEIPT COPIED.'},fail)}catch(err){fail()}
  }
});

/* ---------- input ---------- */
function bind(btn,fn){btn.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();fn()});
  btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
bind(el.buy,pressBuy);bind(el.sell,pressSell);bind(el.lock,pressLock);
document.addEventListener('keydown',function(e){
  if(mode!=='play'||e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='b'||k==='arrowup')pressBuy();else if(k==='s'||k==='arrowdown')pressSell();else if(k==='l')pressLock();
  else if(k==='1')useCons(0);else if(k==='2')useCons(1);
});
$('muteBtn').addEventListener('click',function(){muted=!muted;this.textContent=muted?'SOUND OFF':'SOUND ON'});

/* ---------- boot ---------- */
S=blankRun();prepLevel();showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
