[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
# Robinhood Chain testnet, chain id 46630 (docs.robinhood.com/chain/connecting). Testnet only.
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
# Expiry and day boundaries are timestamp based by design (days to months), as in the SDK.
exclude_lints = ["block-timestamp"]
