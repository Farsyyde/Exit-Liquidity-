<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Exit Liquidity</title>
<style>
:root{
  /* Layout: one phone-width column, HUD on top, chart in the middle, items and big trade buttons at the thumb. Single dark CRT theme by choice. */
  color-scheme: dark;
  --felt:#16332f;
  --felt-2:#0e2220;
  --panel:#1f2636;
  --panel-edge:#3a4662;
  --cream:#efe6cf;
  --ink:#141821;
  --up:#4bc292;
  --down:#fe5f55;
  --gold:#f5b83d;
  --blue:#3aa0ff;
  --curse:#b06cff;
  --dim:#8a94ad;
  --display:"Silkscreen","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--felt-2);
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 15%, #24544c 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 80%, #3a2a4d 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 50% 50%, var(--felt) 0%, var(--felt-2) 100%);
  background-size:160% 160%,160% 160%,100% 100%;
  animation:swirl 24s ease-in-out infinite alternate;
  color:var(--cream);
  font-family:var(--body);
  font-size:20px;
  line-height:1.1;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
@keyframes swirl{from{background-position:0% 0%,100% 100%,0 0}to{background-position:100% 60%,0% 30%,0 0}}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  box-shadow:inset 0 0 90px rgba(0,0,0,.55);
}
#app{
  height:100%;max-width:480px;margin:0 auto;padding:10px 16px 12px;
  display:flex;flex-direction:column;gap:6px;
}
#app.shake{animation:shake .28s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.panel{background:var(--panel);border:2px solid var(--panel-edge);border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.55)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--display);font-size:12px}
.hud .layer{background:var(--gold);color:var(--ink);padding:3px 8px;border-radius:5px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.hud .coin{flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .coin b{color:var(--gold)}
.hud button{font-family:var(--display);font-size:10px;background:var(--panel);color:var(--dim);border:2px solid var(--panel-edge);border-radius:5px;padding:3px 7px}
.hud button:focus-visible,.btn:focus-visible,.card:focus-visible,.citem:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.timer{position:relative;height:16px;border-radius:5px;overflow:hidden;background:#0c1018;border:2px solid var(--panel-edge)}
#timerFill{position:absolute;inset:0;width:100%;background:var(--blue);transform-origin:left}
#timerTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;color:#fff;text-shadow:0 1px 0 #000}
.timer.low #timerFill{background:var(--down)}
.score{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:7px}
.score > div{padding:5px 9px 4px}
.score label{display:block;font-family:var(--display);font-size:9px;color:var(--dim);letter-spacing:.5px}
.score b{display:block;font-weight:400;font-size:30px;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
#eq{color:var(--cream)} #eq.win{color:var(--up)} #eq.lose{color:var(--down)}
#tg{color:var(--gold)} #mult{color:var(--blue)}
#mult.hot{color:var(--down);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.chartwrap{position:relative;flex:1;min-height:120px;overflow:hidden;background:#0c1018}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block}
#posTag{position:absolute;left:8px;top:6px;font-family:var(--display);font-size:11px;padding:3px 7px;border-radius:5px;background:rgba(12,16,24,.85);border:2px solid var(--panel-edge);display:none}
#pops{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap;text-align:center;text-shadow:0 3px 0 #000;animation:pop 1.3s ease-out forwards}
.pop small{display:block;font-size:11px;font-weight:400;white-space:normal;width:280px;margin:0 auto}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
.news{padding:5px 9px;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:19px}
.news .h{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news .h.old{color:var(--dim)}
.news .h.new{animation:flash .8s steps(2) 1;white-space:normal;line-height:1}
.news .h.fake{color:var(--dim);text-decoration:line-through}
.news .tag{font-family:var(--display);font-size:9px;background:var(--gold);color:var(--ink);padding:1px 4px;border-radius:3px;margin-right:6px;vertical-align:2px}
.news .tag.fk{background:var(--down);color:#fff}
.news .tag.me{background:var(--blue);color:#fff}
@keyframes flash{50%{background:rgba(245,184,61,.35)}}
.inds{display:flex;gap:5px;min-height:52px;align-items:stretch}
.card{
  flex:1;min-width:0;max-width:74px;background:var(--cream);color:var(--ink);border:2px solid #fff;border-radius:6px;
  box-shadow:0 3px 0 rgba(0,0,0,.6);padding:3px 2px 2px;text-align:center;font-family:var(--display);
  animation:wob 3.4s ease-in-out infinite;cursor:pointer;
}
.card:nth-child(2n){animation-delay:-1.1s}.card:nth-child(3n){animation-delay:-2.2s}
@keyframes wob{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg) translateY(-1px)}}
.card .g{font-size:19px;line-height:1.1;display:block;font-weight:700}
.card .n{font-size:7px;line-height:1.05;display:block;overflow:hidden;height:15px}
.card.empty{background:transparent;border:2px dashed var(--panel-edge);box-shadow:none;animation:none;cursor:default}
.card.cursed{background:#2b1d3a;color:#f0d9ff;border-color:var(--curse)}
.card.nft{background:linear-gradient(135deg,#ffd1f3,#c9f2ff 50%,#fff3b8);color:var(--ink);border-color:var(--gold)}
.card.sel{outline:3px solid var(--blue)}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.citem{font-family:var(--display);font-size:10px;font-weight:700;padding:8px 4px 7px;border-radius:7px;border:2px solid #fff;background:var(--blue);color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.citem:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.citem.empty{background:transparent;border:2px dashed var(--panel-edge);color:var(--panel-edge);box-shadow:none;font-weight:400;cursor:default}
.info{min-height:20px;font-size:18px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.btn{
  font-family:var(--display);font-weight:700;font-size:20px;color:#fff;border:0;border-radius:9px;padding:14px 4px 12px;
  box-shadow:0 5px 0 rgba(0,0,0,.6);text-shadow:0 2px 0 rgba(0,0,0,.4);cursor:pointer;line-height:1;
}
.btn small{display:block;font-size:9px;font-weight:400;margin-top:4px;opacity:.9}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn:disabled{filter:grayscale(.9) brightness(.55);cursor:default}
.buy{background:var(--up)} .sell{background:var(--down)}
.lock{background:var(--panel);border:2px solid var(--panel-edge);color:var(--dim);font-size:15px}
.lock.ready{background:var(--gold);border-color:#fff;color:var(--ink);text-shadow:none;animation:pulse .45s ease-in-out infinite alternate}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,10,14,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.hide{display:none}
.modal{width:100%;max-width:440px;max-height:96%;overflow-y:auto;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;font-size:21px}
.modal h1{font-family:var(--display);font-size:27px;line-height:1;color:var(--gold);text-shadow:0 3px 0 #000;text-wrap:balance}
.modal h2{font-family:var(--display);font-size:14px;color:var(--cream);text-wrap:balance}
.modal p{line-height:1.12}
.modal .eyebrow{font-family:var(--display);font-size:10px;color:var(--dim);letter-spacing:1px}
.modal .lore{background:var(--cream);color:var(--ink);border-radius:6px;padding:9px 11px;box-shadow:0 3px 0 rgba(0,0,0,.6);transform:rotate(-.5deg)}
.modal ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.modal li{padding-left:16px;position:relative;line-height:1.1}
.modal li::before{content:">";position:absolute;left:0;color:var(--gold)}
.chip{display:inline-block;font-family:var(--display);font-size:10px;padding:3px 7px;border-radius:4px;background:var(--down);color:#fff;margin-right:5px}
.chip.g{background:var(--up);color:var(--ink)} .chip.y{background:var(--gold);color:var(--ink)} .chip.b{background:var(--blue)} .chip.c{background:var(--curse)}
.row{display:flex;gap:8px;align-items:center}
.row > .btn{flex:1}
.btn.go{background:var(--blue);font-size:17px;padding:13px 6px 11px}
.btn.alt{background:var(--panel);border:2px solid var(--panel-edge);font-size:13px;padding:11px 6px 9px}
.offer{display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;padding:6px 8px;background:#161c29;border:2px solid var(--panel-edge);border-radius:7px}
.offer .card{animation:none;max-width:none;cursor:default}
.offer .card.con{background:var(--blue);color:#fff}
.offer .t{font-family:var(--display);font-size:12px;color:var(--cream)}
.offer .d{font-size:18px;color:var(--dim);line-height:1.02}
.offer .btn{font-size:13px;padding:10px 9px 8px;background:var(--gold);color:var(--ink);text-shadow:none}
.offer.sold{opacity:.35}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.stat span:nth-child(2n){color:var(--gold);text-align:right}
.alpha{color:var(--blue);font-family:var(--display);font-size:14px}
#rcpt{display:none;width:100%;height:90px;min-height:90px;flex-shrink:0;background:#0c1018;color:var(--dim);border:2px solid var(--panel-edge);border-radius:6px;font-family:var(--body);font-size:15px;padding:6px;-webkit-user-select:text;user-select:text}
@media (max-height:660px){.news{min-height:44px;font-size:17px}.btn{padding:10px 4px 8px}.score b{font-size:25px}.inds{min-height:44px}.card .n{display:none}}
@media (prefers-reduced-motion:reduce){body,.card,#app.shake,.lock.ready,#mult.hot{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="layer" id="layer">LAYER 8</span>
    <span class="coin"><b id="tk">$WAGMI</b> <span id="px">0.0000</span></span>
    <button id="muteBtn" type="button" aria-label="Toggle sound">SOUND ON</button>
  </div>
  <div class="timer" id="timer"><div id="timerFill"></div><span id="timerTxt">45s</span></div>
  <div class="score">
    <div class="panel"><label>EQUITY</label><b id="eq">$100.00</b></div>
    <div class="panel"><label>TARGET</label><b id="tg">$125.00</b></div>
    <div class="panel"><label>STREAK MULT</label><b id="mult">x1.0</b></div>
  </div>
  <div class="chartwrap panel">
    <canvas id="chart"></canvas>
    <div id="posTag"></div>
    <div id="pops"></div>
  </div>
  <div class="news panel" id="news"><div class="h old">The wire is quiet. Headlines land here before the chart moves.</div></div>
  <div class="inds" id="inds"></div>
  <div class="info" id="info">Indicators and items you buy between levels show up here.</div>
  <div class="cons" id="cons"></div>
  <div class="btns">
    <button class="btn buy" id="buyBtn" type="button">BUY<small>ALL IN</small></button>
    <button class="btn lock" id="lockBtn" type="button" disabled>0%<small>OF TARGET</small></button>
    <button class="btn sell" id="sellBtn" type="button">SELL<small>ALL OUT</small></button>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal panel" id="modal"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
